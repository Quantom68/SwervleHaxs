    <!-- `viewport-fit=cover` lets the race canvas run under a notch and the home
         indicator; the HUD and touch controls pay for it back with the
         `env(safe-area-inset-*)` padding in swervle.css. `user-scalable=no` plus
         a locked scale is deliberate on a driving game: a two-finger pinch during
         a race is never a zoom request, it is a thumb on the gas and a thumb on
         the brake. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e7c78" />
    <!-- Swervle is already a dark UI. Saying so in the <head> reaches a global
         dark-theme extension before any stylesheet has loaded, which is the only
         point at which it is cheap to opt out: left undeclared, those extensions
         rewrite every stylesheet on each DOM mutation or filter the whole document,
         and over a full-screen WebGL canvas that is ruinous — one such profile took
         eight seconds to load a map that takes one elsewhere. `color-scheme` is the
         standard signal (and is mirrored on :root in styles.css); `darkreader-lock`
         is Dark Reader's own opt-out, which its many forks also honour. -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <!-- Shipped from public/, so it is served same-origin by the ASSETS binding.
         THE .ICO IS FIRST AND IT IS THE ONE GOOGLE READS. Its crawler goes
         looking for /favicon.ico and, until now, got a 404 from this site — which
         is how a search result ends up with the placeholder globe next to it
         while the tab in your own browser shows the real thing. Browsers read the
         PNG below and are unaffected either way.
         Three rasters in the one file (16/32/48) so a tab, a bookmark bar and a
         Windows shortcut each get a size drawn for them instead of one downscale. -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <!-- Widescreen, fullscreen, installable. `/` because `build:release`
         ships under /swervle/; the icon and start_url inside the manifest are
         relative to the manifest itself, so they follow the same base. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- iOS Safari implements no Fullscreen API on iPhone. These three tags ARE
         the iOS fullscreen story: with them, "Add to Home Screen" launches
         Swervle with no browser chrome at all, and the black-translucent bar
         style lets the race draw behind the status bar. Without them the same
         home-screen icon opens an ordinary Safari tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swervle" />

    <!-- The homepage's search snippet — the line Google prints under the title.

         one sentence by owner decision — do not append explanatory clauses. -->
    <meta name="description" content="New racing map every day" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Site-root canonical. Deep routes get their own via link-preview head

    <!-- The SERP title for the one page Swervle wants indexed. `src/main.ts` resets
         document.title to "Swervle" on boot, so the browser tab still always reads
         "Swervle" per the owner rule; only crawlers and the pre-boot document see
         the longer form. Keep in sync with SWERVLE_SEO_TAGLINE_V1. -->
    <title>Swervle - Daily Racing Game</title>
    <!-- Boot used to be one long serial chain: bundle, then track document, then
         car model, each waiting on the one before it. These two start the other
         two legs immediately, in parallel with the bundle.

         The car model is route-independent so a plain preload is correct; the
         track document is not, so it goes through race-prefetch.js, which picks
         the endpoint from the URL. Keep both BEFORE the module script — the
         point is to be in flight while the bundle is still arriving.

         Both use / rather than a root-absolute path: `build:release`
         ships under /swervle/, and validate-production-bundle.mjs fails the
         build on any protected asset URL that ignores the configured base.

         Both are `fetchpriority="low"`. This is load-bearing, not a hint to be
         tidied away: the bundle is the ONLY thing that can draw a pixel of UI, and
         letting these two race it for bandwidth pushed first contentful paint on
         Slow 4G from 2.7s to 6.0s — six seconds of blank page, which reads as a
         much slower load than the 2.5s it saved at the far end. Low priority keeps
         them in flight early while the bundle still gets the pipe. -->
    <link
      rel="preload"
      as="fetch"
      crossorigin
      fetchpriority="low"
      href="assets/car.glb"
    />
